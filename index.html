<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 Image Effects Assignment - Joseph Davila</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS3 Image Effects & Transformations</h1>
        <p>Demonstrating modern CSS shadows, gradients, and filters using code only.</p>
    </header>

    <main class="gallery-container">

        <!-- Project 1: Penguins (Grayscale / Winter Tone) -->
        <section class="project-card">
            <h2>1. Arctic Penguins</h2>
            <div class="image-wrapper penguin-effect">
                <img src="penguins.jpg" alt="Group of penguins in snow">
            </div>
        </section>

        <!-- Project 2: Butterfly (Sepia / Vintage Effect) -->
        <section class="project-card">
            <h2>2. Monarch Butterfly</h2>
            <div class="image-wrapper butterfly-effect">
                <img src="butterfly.jpg" alt="Monarch butterfly on flowers">
            </div>
        </section>

        <!-- Project 3: Seagull (Drop Shadow & Glow) -->
        <section class="project-card">
            <h2>3. Flying Seagull</h2>
            <div class="image-wrapper seagull-effect">
                <img src="seagull.png" alt="Seagull in flight">
            </div>
        </section>

        <!-- Project 4: Dinosaur (Hue Rotation & Glow) -->
        <section class="project-card">
            <h2>4. Cartoon Dinosaur</h2>
            <div class="image-wrapper dinosaur-effect">
                <img src="dinosaur.png" alt="Green cartoon dinosaur">
            </div>
        </section>

        <!-- Project 5: Theater Stage (Spotlight Gradient Overlay) -->
        <section class="project-card">
            <h2>5. Theater Stage Spotlight</h2>
            <div class="image-wrapper stage-effect">
                <img src="theater_stage.jpg" alt="Red theater stage curtains">
            </div>
        </section>

        <!-- Project 6: Football Field & Tic-Tac-Toe Overlay -->
        <section class="project-card">
            <h2>6. Football Field Tic-Tac-Toe</h2>
            <div class="image-wrapper football-composite">
                <img src="football_field.jpg" alt="Football field background" class="bg-field">
                <img src="tic-tac-toe.png" alt="Tic-tac-toe board overlay" class="overlay-ttt">
            </div>
        </section>

    </main>

</body>
</html>
